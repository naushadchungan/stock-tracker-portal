openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tiles Stock Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Authentication endpoints.
  - name: users
    description: User management (admin only)
  - name: depots
    description: Depot management
  - name: stock
    description: Stock items
  - name: uploads
    description: PDF upload and processing

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Missing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and clear session
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List all users (admin only)
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
    post:
      tags: [users]
      operationId: createUser
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user's role or password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
        '400':
          description: Cannot delete yourself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /depots:
    get:
      operationId: listDepots
      tags: [depots]
      summary: List all depots
      responses:
        "200":
          description: List of depots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Depot"
    post:
      operationId: createDepot
      tags: [depots]
      summary: Create a new depot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepotInput"
      responses:
        "201":
          description: Created depot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Depot"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /depots/{id}:
    get:
      operationId: getDepot
      tags: [depots]
      summary: Get a depot by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Depot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Depot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDepot
      tags: [depots]
      summary: Update a depot name or location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: ["string", "null"]
      responses:
        "200":
          description: Updated depot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Depot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDepot
      tags: [depots]
      summary: Delete a depot and all its stock data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock:
    get:
      operationId: listStock
      tags: [stock]
      summary: Search and list stock items
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by tile name, brand, or design
        - name: depotId
          in: query
          schema:
            type: ["integer", "null"]
          description: Filter by depot ID
        - name: brand
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by brand name
        - name: size
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by tile size (e.g. 1200X600)
        - name: finish
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by finish (GLOSSY, MATT, etc.)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated stock items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPage"

  /stock/summary:
    get:
      operationId: getStockSummary
      tags: [stock]
      summary: Get stock summary grouped by depot
      responses:
        "200":
          description: Stock summary per depot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepotSummary"

  /stock/filters:
    get:
      operationId: getStockFilters
      tags: [stock]
      summary: Get available filter values (brands, sizes, finishes)
      parameters:
        - name: depotId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Available filter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockFilters"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List recent PDF uploads
      parameters:
        - name: depotId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of uploads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Upload"
    post:
      operationId: uploadPdf
      tags: [uploads]
      summary: Upload a PDF stock report for a depot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "201":
          description: Upload created and processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/{id}:
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Get upload status and details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Depot:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        lastUploadAt:
          type: ["string", "null"]
        itemCount:
          type: integer
      required:
        - id
        - name
        - createdAt
        - itemCount

    DepotInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        location:
          type: string
      required:
        - name

    StockItem:
      type: object
      properties:
        id:
          type: integer
        depotId:
          type: integer
        depotName:
          type: string
        tileName:
          type: string
        brand:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        design:
          type: ["string", "null"]
        finish:
          type: ["string", "null"]
        boxCount:
          type: ["number", "null"]
        pcsCount:
          type: ["number", "null"]
        stockDate:
          type: ["string", "null"]
          format: date
        uploadId:
          type: integer
        updatedAt:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        hasImage:
          type: boolean
      required:
        - id
        - depotId
        - depotName
        - tileName
        - updatedAt
        - uploadId
        - hasImage

    StockPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - items
        - total
        - page
        - limit
        - totalPages

    DepotSummary:
      type: object
      properties:
        depotId:
          type: integer
        depotName:
          type: string
        totalItems:
          type: integer
        totalBoxes:
          type: number
        lastUploadAt:
          type: ["string", "null"]
          format: date-time
        stockDate:
          type: ["string", "null"]
          format: date
      required:
        - depotId
        - depotName
        - totalItems
        - totalBoxes

    StockFilters:
      type: object
      properties:
        brands:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        finishes:
          type: array
          items:
            type: string
      required:
        - brands
        - sizes
        - finishes

    Upload:
      type: object
      properties:
        id:
          type: integer
        depotId:
          type: integer
        depotName:
          type: string
        filename:
          type: string
        status:
          type: string
          enum: [pending, processing, done, failed]
        itemsExtracted:
          type: ["integer", "null"]
        errorMessage:
          type: ["string", "null"]
        stockDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        processingTimeMs:
          type: ["integer", "null"]
        parserUsed:
          type: ["string", "null"]
        templateMatched:
          type: ["string", "null"]
        similarityScore:
          type: ["number", "null"]
        confidenceScore:
          type: ["number", "null"]
        confidenceDecision:
          type: ["string", "null"]
        claudeUsed:
          type: ["boolean", "null"]
        validationRequired:
          type: ["boolean", "null"]
      required:
        - id
        - depotId
        - depotName
        - filename
        - status
        - createdAt

    UploadInput:
      type: object
      properties:
        depotId:
          type: integer
        stockDate:
          type: string
          format: date
        file:
          type: string
          format: binary
      required:
        - depotId
        - file

    AuthUser:
      type: object
      required: [id, username, email, firstName, lastName, profileImageUrl, role]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: string
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    UserRecord:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        role:
          type: string
        createdAt:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserRecord'
    UserListEnvelope:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserRecord'
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        role:
          type: string
          enum: [admin, user]
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
        password:
          type: string
          minLength: 1
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
